<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="logo.png">
<title>Admin - Keuangan Remaja Masjid Nurussalam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  :root { --hijau:#b71c1c; --segar:#ef5350; --mint:#ffebee; --garis:#f8cfd0; --emas:#f2b705; --teks:#3a1a1a; }
  body { background:#fff5f5; color:var(--teks); font-family:'Nunito',system-ui,sans-serif; font-size:1.05rem; }
  h1,h2,.h5,.btn-hijau { font-family:'Baloo 2','Nunito',sans-serif; }
  header { background:linear-gradient(135deg,#b71c1c 0%,#e53935 100%); color:#fff; padding:1.5rem 1rem 1.8rem; border-bottom:6px solid var(--emas); border-radius:0 0 28px 28px; box-shadow:0 8px 20px rgba(183,28,28,.25);
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='56' height='56'><path d='M28 4l5 11 11-5-5 11 11 5-11 5 5 11-11-5-5 11-5-11-11 5 5-11-11-5 11-5-5-11 11 5z' fill='none' stroke='white' stroke-opacity='.13' stroke-width='1.3'/></svg>"), linear-gradient(135deg,#b71c1c 0%,#e53935 100%); }
  header h1 { font-size:1.7rem; margin:0; font-weight:700; line-height:1.15; }
  header p { margin:.25rem 0 0; color:#fff3c2; font-weight:600; }
  .kepala { display:flex; align-items:center; gap:1rem; max-width:900px; margin:0 auto; text-align:left; }
  .kepala img { width:70px; height:70px; object-fit:contain; background:#fff; border-radius:50%; padding:5px; flex-shrink:0; border:3px solid var(--emas); box-shadow:0 4px 10px rgba(0,0,0,.2); }
  @media (max-width:480px) { .kepala img { width:56px; height:56px; } header h1 { font-size:1.25rem; } }
  main h2 { font-weight:700; color:var(--hijau); padding-left:.7rem; border-left:6px solid var(--emas); font-size:1.3rem; }
  .salam { background:#fff; border:2px dashed var(--segar); border-radius:16px; padding:.8rem 1rem; color:var(--hijau); font-weight:600; }
  .kotak { border-radius:18px; padding:1rem; height:100%; border:2px solid var(--garis); background:#fff; box-shadow:0 4px 12px rgba(183,28,28,.08); }
  .kotak small { display:block; font-weight:700; color:#7a5555; }
  .kotak strong { font-family:'Baloo 2',sans-serif; font-size:1.35rem; line-height:1.3; }
  .row > div:nth-child(1) .kotak { background:#ffeceb; }
  .row > div:nth-child(2) .kotak { background:#dcf5e4; border-color:#a9dfbd; }
  .row > div:nth-child(3) .kotak { background:#fff1e6; border-color:#ffd0a8; }
  .kotak.utama { background:linear-gradient(135deg,#b71c1c,#e53935); border-color:var(--emas); border-width:3px; color:#fff; }
  .kotak.utama small { color:#fff3c2; }
  .masuk { color:#16854a; font-weight:700; } .keluar { color:#e8590c; font-weight:700; }
  .table-responsive { border-radius:18px; border:2px solid var(--garis) !important; background:#fff !important; box-shadow:0 4px 12px rgba(183,28,28,.08); }
  th, td { vertical-align:middle; }
  th { background:var(--hijau) !important; color:#fff !important; white-space:nowrap; font-weight:700; }
  .buku { min-width:680px; }
  .buku th.th-masuk { background:#2e9e5b !important; } .buku th.th-keluar { background:#e8590c !important; }
  .buku td.c-masuk { color:#16854a; font-weight:700; background:#effaf2; }
  .buku td.c-keluar { color:#e8590c; font-weight:700; background:#fff4ec; }
  .buku td.c-saldo { font-weight:800; color:var(--hijau); }
  .kat { display:inline-block; font-size:.8rem; font-weight:700; color:var(--hijau); background:var(--mint); border-radius:20px; padding:0 .55rem; margin-top:.15rem; }
  .form-label { font-weight:700; color:var(--hijau); }
  .form-control, .form-select { border:2px solid var(--garis); border-radius:12px; padding:.65rem .8rem; font-size:1.05rem; }
  .form-control:focus, .form-select:focus { border-color:var(--segar); box-shadow:0 0 0 .25rem rgba(239,83,80,.2); }
  .btn-hijau { background:linear-gradient(135deg,#e53935,#b71c1c); color:#fff; font-weight:700; font-size:1.1rem; padding:.55rem 1.6rem; border-radius:50px; border:0; box-shadow:0 4px 10px rgba(183,28,28,.3); }
  .btn-hijau:hover { background:#b71c1c; color:#fff; }
  .btn-sm { border-radius:50px; font-weight:700; }
  #formKotak { border-radius:20px !important; border:2px solid var(--garis) !important; box-shadow:0 6px 16px rgba(183,28,28,.1); }
  #formKotak.edit { border:3px solid var(--emas) !important; background:#fffbe6 !important; }
  .program { margin-left:auto; text-align:right; flex-shrink:0; }
  .program small { display:block; font-size:.75rem; font-weight:600; color:#ffe3e3; }
  .program b { display:block; font-family:'Baloo 2',sans-serif; font-size:1.05rem; line-height:1.2; }
  .program span { display:block; font-size:.72rem; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:#f2b705; }
  @media (max-width:600px) { .kepala { flex-wrap:wrap; } .program { order:-1; width:100%; margin-bottom:.2rem; } .program b { font-size:.95rem; } }
</style>
</head>
<body>
<header>
  <div class="kepala">
    <img src="logo.png" alt="Logo Masjid Nurussalam" onerror="this.style.display='none'">
    <div>
      <h1>Admin Keuangan Remaja Masjid Nurussalam</h1>
      <p>Halaman khusus takmir</p>
    </div>
    <div class="program"><small>Dibuat Oleh :</small><b>PLK Logandeng 2026</b><span>UNY Mengabdi 2026/1</span></div>
  </div>
</header>

<main class="container py-4" style="max-width:900px">
  <div id="formKotak" class="bg-white border rounded p-3 mb-4">
    <h2 class="h5 mb-3" id="judulForm">Tambah transaksi</h2>
    <input type="hidden" id="id">
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label" for="tanggal">Tanggal</label>
        <input type="date" id="tanggal" class="form-control">
      </div>
      <div class="col-md-6">
        <label class="form-label" for="tipe">Jenis transaksi</label>
        <select id="tipe" class="form-select">
          <option value="Masuk">Pemasukan</option>
          <option value="Keluar">Pengeluaran</option>
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label" for="kategori">Kategori</label>
        <select id="kategori" class="form-select"></select>
      </div>
      <div class="col-md-6">
        <label class="form-label" for="nominal">Nominal (Rp)</label>
        <input type="number" id="nominal" class="form-control" min="1" inputmode="numeric" placeholder="Contoh: 150000">
      </div>
      <div class="col-12">
        <label class="form-label" for="keterangan">Keterangan</label>
        <input type="text" id="keterangan" class="form-control" placeholder="Contoh: Iuran bulan Oktober">
      </div>
    </div>
    <div id="notif" class="alert d-none mt-3 mb-0"></div>
    <div class="mt-3 d-flex gap-2">
      <button id="btnSimpan" class="btn btn-hijau" onclick="simpan()">Simpan</button>
      <button id="btnBatal" class="btn btn-outline-secondary d-none" onclick="reset()">Batal edit</button>
    </div>
  </div>

  <h2 class="h5 mb-3">Riwayat transaksi</h2>
  <div class="table-responsive bg-white border rounded">
    <table class="table table-hover mb-0 buku">
      <thead><tr><th>Tanggal</th><th>Keterangan</th><th class="text-end th-masuk">Pemasukan</th><th class="text-end th-keluar">Pengeluaran</th><th class="text-end">Saldo</th><th></th></tr></thead>
      <tbody id="isi"><tr><td colspan="6" class="text-center text-muted">Memuat data...</td></tr></tbody>
    </table>
  </div>
</main>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycby8APv5sUAzBjIPXAX5JCTmIAUw2VF2fliu4iIP20lAmRYzJ1iVYsUBBOfTsm6FgkEh9g/exec';
const KATEGORI = {
  Masuk: ['Kas Masjid', 'Iuran Anggota', 'Donasi', 'Pemasukan Lain-Lain'],
  Keluar: ['Konsumsi', 'Kegiatan Keagamaan', 'Kegiatan Ramadhan', 'Kegiatan Sosial', 'Pengeluaran Lain-Lain']
};
const rp = n => 'Rp ' + Number(n).toLocaleString('id-ID');
function tglIndo(t) {
  const B = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
  const [y, m, d] = t.split('-'); return d + ' ' + B[m-1] + ' ' + y;
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = id => document.getElementById(id);
let dataSemua = [];

function isiKategori(pilih) {
  $('kategori').innerHTML = KATEGORI[$('tipe').value].map(k => `<option>${k}</option>`).join('');
  if (pilih) $('kategori').value = pilih;
}
$('tipe').addEventListener('change', () => isiKategori());

function hariIni() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function notif(teks, jenis) {
  const n = $('notif');
  n.className = 'alert mt-3 mb-0 alert-' + jenis;
  n.textContent = teks;
}

function reset() {
  $('id').value = ''; $('nominal').value = ''; $('keterangan').value = '';
  $('tanggal').value = hariIni(); $('tipe').value = 'Masuk'; isiKategori();
  $('judulForm').textContent = 'Tambah transaksi';
  $('btnSimpan').textContent = 'Simpan';
  $('btnBatal').classList.add('d-none');
  $('formKotak').classList.remove('edit');
}

async function muat() {
  try {
    const res = await fetch(API_URL);
    const json = await res.json();
    if (json.status !== 'ok') throw new Error(json.message);
    dataSemua = json.data.sort((a,b) => b.tanggal.localeCompare(a.tanggal));
    tampil();
  } catch (e) {
    $('isi').innerHTML = '<tr><td colspan="6" class="text-center text-danger">Data gagal dimuat. Periksa koneksi lalu muat ulang.</td></tr>';
  }
}

function tampil() {
  const data = dataSemua;
  const urut = data.map((t, i) => ({ ...t, i })).sort((a, b) => a.tanggal.localeCompare(b.tanggal) || a.i - b.i);
  let saldo = 0;
  urut.forEach(t => { saldo += t.tipe === 'Masuk' ? t.nominal : -t.nominal; t.saldo = saldo; });
  const terbaru = urut.reverse().slice(0, 50);
  $('isi').innerHTML = terbaru.length ? terbaru.map(t => `
    <tr>
      <td class="text-nowrap">${tglIndo(t.tanggal)}</td>
      <td>${esc(t.keterangan || '-')}<span class="kat">${esc(t.kategori)}</span></td>
      <td class="text-end text-nowrap c-masuk">${t.tipe === 'Masuk' ? rp(t.nominal) : '-'}</td>
      <td class="text-end text-nowrap c-keluar">${t.tipe === 'Keluar' ? rp(t.nominal) : '-'}</td>
      <td class="text-end text-nowrap c-saldo">${rp(t.saldo)}</td>
      <td class="text-nowrap"><button class="btn btn-sm btn-outline-success" onclick="edit('${esc(t.id)}')">Edit</button>
        <button class="btn btn-sm btn-outline-danger ms-1" onclick="hapus('${esc(t.id)}')">Hapus</button></td>
    </tr>`).join('') : '<tr><td colspan="6" class="text-center text-muted">Belum ada transaksi.</td></tr>';
}

function edit(id) {
  const t = dataSemua.find(x => x.id === id);
  if (!t) return;
  $('id').value = t.id;
  $('tanggal').value = t.tanggal;
  $('tipe').value = t.tipe; isiKategori(t.kategori);
  $('nominal').value = t.nominal;
  $('keterangan').value = t.keterangan;
  $('judulForm').textContent = 'Ubah transaksi';
  $('btnSimpan').textContent = 'Update';
  $('btnBatal').classList.remove('d-none');
  $('formKotak').classList.add('edit');
  notif('', 'light'); $('notif').classList.add('d-none');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

async function hapus(id) {
  const t = dataSemua.find(x => x.id === id);
  if (!t) return;
  if (!confirm('Hapus transaksi ini?\n\n' + t.tanggal + ' - ' + (t.keterangan || t.kategori) + ' - ' + rp(t.nominal) + '\n\nData yang dihapus tidak bisa dikembalikan.')) return;
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'hapus', id: id })
    });
    const json = await res.json();
    if (json.status !== 'ok') throw new Error(json.message);
    if ($('id').value === id) reset();
    notif('Data berhasil dihapus.', 'success');
    await muat();
  } catch (e) {
    notif('Gagal menghapus: ' + e.message, 'danger');
  }
}

async function simpan() {
  const payload = {
    id: $('id').value,
    tanggal: $('tanggal').value,
    tipe: $('tipe').value,
    kategori: $('kategori').value,
    keterangan: $('keterangan').value.trim(),
    nominal: Number($('nominal').value)
  };
  if (!payload.tanggal || !(payload.nominal > 0)) {
    return notif('Isi tanggal dan nominal terlebih dahulu.', 'warning');
  }
  const btn = $('btnSimpan'), label = btn.textContent;
  btn.disabled = true; btn.textContent = 'Menyimpan...';
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // menghindari preflight CORS
      body: JSON.stringify(payload)
    });
    const json = await res.json();
    if (json.status !== 'ok') throw new Error(json.message);
    const mode = json.mode;
    reset();
    notif(mode === 'update' ? 'Data berhasil diubah.' : 'Data berhasil disimpan.', 'success');
    await muat();
  } catch (e) {
    notif('Gagal menyimpan: ' + e.message, 'danger');
    btn.textContent = label;
  } finally {
    btn.disabled = false;
  }
}

reset();
muat();
</script>
</body>
</html>
